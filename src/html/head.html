<!-- 2. Критические стили лоадера — инлайн, чтобы он был виден мгновенно -->
<style>
/* ============================================================
   YH LOADER (вариант 4): контур → заливка → огонёк → 10

  /* html.is-loading, html.is-loading body { overflow: hidden; } */
#yh-loader {
  --yh-bg: #2f3d46;

}

.yh-lockup { display: flex; align-items: flex-end; }

.yh-mark {

  height: var(--yh-size);
  width: calc(var(--yh-size) * 0.8305);   /* 338 / 407 */

}
.yh-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }

.yh-outline {

  stroke-width: 5;
  stroke-dasharray: 100;

  animation: yh-draw 1.5s cubic-bezier(.5,0,.3,1) forwards,

}
.yh-fill { fill: var(--yh-brand); opacity: 0; animation: yh-in .55s ease-out 1.45s forwards; }

.yh-flame {
  position: absolute;
  left: 98.2%;
  top: 1%;

  transform-origin: 0 0;
  opacity: 0;

}
.yh-flame > i { position: absolute; left: 0; top: 0; display: block; }
.yh-glow {
  width: calc(var(--yh-size) * .37); height: calc(var(--yh-size) * .37);
  border-radius: 50%;

}
.yh-body {

}

/* цифра заходит под правую ветвь знака */
.yh-ten {

}
@media (prefers-reduced-motion: reduce) {

</style>
